name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # prisma.config.ts requires DATABASE_URL to be present during `prisma generate`
      # (it never connects to it in a build). Runtime uses compose env_file instead.
      - name: Prisma build env
        run: printf 'DATABASE_URL="postgresql://prisma:prisma@localhost:5432/build"\n' > ./server/.env

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ghcr.io/ahmed-lotfy-dev/pos-system-server:latest

      - uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            docker pull ghcr.io/ahmed-lotfy-dev/pos-system-server:latest
            docker tag ghcr.io/ahmed-lotfy-dev/pos-system-server:latest pos-api:latest
            cd ~/apps/pos-api
            docker compose up -d
            docker image prune -f
